name: Task 1 CI

on:
    push:
        branches: [main]

    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: task 1

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm install

            - name: Run lint
              run: npm run lint

            - name: Run tests
              run: npm test
